<!doctype html>
<html lang="en-gb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Modern PNG & Apple Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Canonical URL Link -->
    <link
      rel="canonical"
      href="<%= htmlWebpackPlugin.options.publicSiteAddress %>"
    />

    <!-- Core SEO -->
    <meta
      name="description"
      content="<%= htmlWebpackPlugin.options.metaDescription %>"
    />

    <!-- Open Graph Protocol (Facebook, LinkedIn, Discord) -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="<%= htmlWebpackPlugin.options.publicSiteAddress %>"
    />
    <meta
      property="og:title"
      content="<%= htmlWebpackPlugin.options.title %>"
    />
    <meta
      property="og:description"
      content="<%= htmlWebpackPlugin.options.warningMessage %>"
    />
    <meta
      property="og:image"
      content="<%= htmlWebpackPlugin.options.publicSiteAddress %>/og-image.png"
    />

    <!-- Twitter / X Cards Optimization -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="<%= htmlWebpackPlugin.options.title %>"
    />
    <meta
      name="twitter:description"
      content="<%= htmlWebpackPlugin.options.warningMessage %>"
    />
    <meta
      name="twitter:image"
      content="<%= htmlWebpackPlugin.options.publicSiteAddress %>/og-image.png"
    />

    <link rel="stylesheet" href="/main.css" />
    <% if (htmlWebpackPlugin.options.isProduction) { %>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((reg) => console.log("SW registered: ", reg))
            .catch((err) => console.error("SW registration failed: ", err));
        });
      }
    </script>
    <% } else { %>
    <script>
      console.log("🛠️ Development Mode: Service Worker injection skipped.");
    </script>
    <% } %>
    <title><%= htmlWebpackPlugin.options.title %></title>
  </head>
  <body>
    <div class="warning">
      <main>
        <div class="warning-card">
          <h1><%= htmlWebpackPlugin.options.warningHeader %></h1>
          <p><%= htmlWebpackPlugin.options.warningMessage %></p>
          <a class="warning-link" href="/">Return to Main Page</a>
        </div>
      </main>
    </div>
  </body>
</html>
