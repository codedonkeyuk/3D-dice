<!doctype html>
<html lang="en-gb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Modern PNG & Apple Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Canonical URL Link -->
    <link
      rel="canonical"
      href="<%= htmlWebpackPlugin.options.publicSiteAddress %>"
    />

    <!-- Core SEO -->
    <meta
      name="description"
      content="<%= htmlWebpackPlugin.options.metaDescription %>"
    />

    <!-- Open Graph Protocol (Facebook, LinkedIn, Discord) -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="<%= htmlWebpackPlugin.options.publicSiteAddress %>"
    />
    <meta
      property="og:title"
      content="<%= htmlWebpackPlugin.options.title %>"
    />
    <meta
      property="og:description"
      content="<%= htmlWebpackPlugin.options.metaDescription %>"
    />
    <meta
      property="og:image"
      content="<%= htmlWebpackPlugin.options.publicSiteAddress %>/og-image.png"
    />

    <!-- Twitter / X Cards Optimization -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="<%= htmlWebpackPlugin.options.title %>"
    />
    <meta
      name="twitter:description"
      content="<%= htmlWebpackPlugin.options.metaDescription %>"
    />
    <meta
      name="twitter:image"
      content="<%= htmlWebpackPlugin.options.publicSiteAddress %>/og-image.png"
    />

    <% if (htmlWebpackPlugin.options.isProduction) { %>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((reg) => console.log("SW registered: ", reg))
            .catch((err) => console.error("SW registration failed: ", err));
        });
      }
    </script>
    <% } else { %>
    <script>
      console.log("🛠️ Development Mode: Service Worker injection skipped.");
    </script>
    <% } %>

    <style>
      :root {
        --bg: #1c6036;
        --card: #ffffff;
        --text-main: #111827;
        --text-muted: #4b5563;
        --border: #d4d4d8;
        --btn-bg: #1f2937;
        --btn-text: #1f2937;
        --btn-hover: #f5f5f5;
        --btn-primary-bg: #e60000;
        --btn-primary-text: #ffffff;
        --btn-primary-bdr: #ffffff;
        --poker-felt: radial-gradient(circle, #247543 0%, #124224 100%);
        --box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
        --card-bdr-radius: 16px;
        --card-bdr-padding: 24px;
        --accessibility-bdr: 3px solid #3b82f6;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c2d5a;
          --card: #000000;
          --border: #e5e7eb;
          --text-main: #f9fafb;
          --text-muted: #9ca3af;
          --border: #1f2937;
          --btn-bg: #f3f4f6;
          --btn-hover: #1a1a1a;
          --poker-felt: radial-gradient(circle, #1c2d5a 0%, #0b132b 100%);
        }
      }

      html,
      body,
      #root,
      #app {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: Helvetica, Arial, sans-serif;
        background: var(--poker-felt, var(--bg));
        color: var(--text-main);
      }

      .loader-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(4px);
        pointer-events: all;
        z-index: 99999;
      }

      .loader-message {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: var(--card);
        color: var(--text-main);
        border: 1px solid var(--border);
        border-radius: var(--card-bdr-radius);
        padding: var(--card-bdr-padding);
      }

      .spinner {
        width: 48px;
        height: 48px;
        border: 1px solid var(--border);
        border-left-color: #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      .loading-text {
        margin-top: 16px;
        color: var(--text-main);
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.05em;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
          border-left-color: rgba(255, 255, 255, 0.4);
        }
      }
    </style>
    <title><%= htmlWebpackPlugin.options.title %></title>
  </head>
  <body>
    <main id="root">
      <div class="loader-background">
        <div class="loader-message">
          <div class="spinner"></div>
          <div class="loading-text">Loading Feature...</div>
        </div>
      </div>
    </main>
  </body>
</html>
