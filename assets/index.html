<!doctype html>
<html lang="en-gb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A 3D dice generator that allows you to customise dice. You can then bookmark, and roll it whenever you like."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dice.codedonkey.uk" />
    <meta property="og:title" content="Code donkey Dice Demo" />
    <meta
      property="og:description"
      content="A 3D dice generator that allows you to customise dice. You can then bookmark, and roll it whenever you like."
    />
    <meta
      property="og:image"
      content="https://dice.codedonkey.uk/favicon-512x512.png"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#247543"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#1c2d5a"
    />
    <link rel="canonical" href="https://dice.codedonkey.uk" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="/favicon-72x72.png" />
    <link rel="apple-touch-icon" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="256x256" href="/favicon-256x256.png" />
    <link rel="apple-touch-icon" sizes="384x384" href="/favicon-384x384.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/favicon-512x512.png" />
    <link rel="manifest" href="/manifest.json" crossorigin="anonymous" />
    <style>
      :root {
        --bg: #1c6036;
        --pane: #ffffff;
        --text-main: #111827;
        --text-muted: #4b5563;
        --border: #d4d4d8;
        --btn-bg: #1f2937;
        --btn-text: #1f2937;
        --btn-hover: #f5f5f5;
        --btn-primary-bg: #e60000;
        --btn-primary-text: #ffffff;
        --btn-primary-bdr: #ffffff;
        --poker-felt: radial-gradient(circle, #247543 0%, #124224 100%);
        --box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
        --pane-bdr-radius: 16px;
        --pane-bdr-padding: 24px;
        --accessibility-bdr: 3px solid #3b82f6;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c2d5a;
          --pane: #000000;
          --border: #e5e7eb;
          --text-main: #f9fafb;
          --text-muted: #9ca3af;
          --border: #1f2937;
          --btn-bg: #f3f4f6;
          --btn-hover: #1a1a1a;
          --poker-felt: radial-gradient(circle, #1c2d5a 0%, #0b132b 100%);
        }
      }

      html,
      body,
      #root,
      #app {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: Helvetica, Arial, sans-serif;
        background: var(--poker-felt, var(--bg));
        color: var(--text-main);
      }

      .loader-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(4px);
        pointer-events: all;
        z-index: 99999;
      }

      .loader-message {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: var(--pane);
        color: var(--text-main);
        border: 1px solid var(--border);
        border-radius: var(--pane-bdr-radius);
        padding: var(--pane-bdr-padding);
      }

      .spinner {
        width: 48px;
        height: 48px;
        border: 1px solid var(--border);
        border-left-color: #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      .loading-text {
        margin-top: 16px;
        color: var(--text-main);
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.05em;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
          border-left-color: rgba(255, 255, 255, 0.4);
        }
      }
    </style>
    <title>Code Donkey - Dice</title>
  </head>
  <body>
    <main id="root">
      <div class="loader-background">
        <div class="loader-message">
          <div class="spinner"></div>
          <div class="loading-text">Loading Feature...</div>
        </div>
      </div>
    </main>
  </body>
</html>
