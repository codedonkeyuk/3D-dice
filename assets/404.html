<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="/favicon-72x72.png" />
    <link rel="apple-touch-icon" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="256x256" href="/favicon-256x256.png" />
    <link rel="apple-touch-icon" sizes="384x384" href="/favicon-384x384.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/favicon-512x512.png" />
    <link rel="manifest" href="/manifest.json" crossorigin="anonymous" />
    <title>Code Donkey - Dice - Page Not Found (404)</title>
    <style>
      :root {
        --bg: #ffffff;
        --text-main: #111827;
        --text-muted: #4b5563;
        --border: #e5e7eb;
        --btn-bg: #1f2937;
        --btn-text: #ffffff;
        --btn-hover: #111827;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0f19;
          --text-main: #f9fafb;
          --text-muted: #9ca3af;
          --border: #1f2937;
          --btn-bg: #f3f4f6;
          --btn-text: #111827;
          --btn-hover: #ffffff;
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Helvetica, Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text-main);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }

      .error-card {
        max-width: 560px;
        width: 100%;
      }

      .header-group {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 24px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 24px;
      }

      .code {
        font-size: 2.25rem;
        font-weight: 700;
        letter-spacing: -0.05em;
        color: var(--text-main);
        line-height: 1;
      }

      .divider {
        width: 1px;
        height: 32px;
        background-color: var(--border);
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }

      p {
        font-size: 1rem;
        color: var(--text-muted);
        line-height: 1.6;
        margin-bottom: 32px;
      }

      .actions {
        display: flex;
        gap: 12px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 4px;
        transition:
          background-color 0.15s ease,
          border-color 0.15s ease;
      }

      .btn-primary {
        background-color: var(--btn-bg);
        color: var(--btn-text);
      }

      .btn-primary:hover {
        background-color: var(--btn-hover);
      }

      .btn-secondary {
        border: 1px solid var(--border);
        color: var(--text-main);
        background-color: transparent;
      }

      .btn-secondary:hover {
        background-color: var(--border);
      }

      @media (max-width: 480px) {
        .header-group {
          flex-direction: column;
          align-items: flex-start;
          gap: 12px;
        }
        .divider {
          display: none;
        }
        .actions {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="error-card">
      <div class="header-group">
        <span class="code" aria-hidden="true">404</span>
        <div class="divider" aria-hidden="true"></div>
        <h1>Page Not Found</h1>
      </div>

      <p>
        The requested page could not be located on this server. The URL may be
        incorrect, or the resource may have been permanently removed.
      </p>

      <div class="actions">
        <a href="/" class="btn btn-primary">Return to Homepage</a>
        <button onclick="window.history.back()" class="btn btn-secondary">
          Go Back
        </button>
      </div>
    </div>
  </body>
</html>
