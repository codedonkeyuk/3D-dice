<!doctype html>
<html lang="en-gb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Modern PNG & Apple Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Canonical URL Link -->
    <link
      rel="canonical"
      href="<%= htmlWebpackPlugin.options.publicSiteAddress %>"
    />

    <!-- Core SEO -->
    <meta
      name="description"
      content="<%= htmlWebpackPlugin.options.metaDescription %>"
    />

    <!-- Open Graph Protocol (Facebook, LinkedIn, Discord) -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="<%= htmlWebpackPlugin.options.publicSiteAddress %>"
    />
    <meta
      property="og:title"
      content="<%= htmlWebpackPlugin.options.title %>"
    />
    <meta
      property="og:description"
      content="<%= htmlWebpackPlugin.options.metaDescription %>"
    />
    <meta
      property="og:image"
      content="<%= htmlWebpackPlugin.options.publicSiteAddress %>/og-image.png"
    />

    <!-- Twitter / X Cards Optimization -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="<%= htmlWebpackPlugin.options.title %>"
    />
    <meta
      name="twitter:description"
      content="<%= htmlWebpackPlugin.options.metaDescription %>"
    />
    <meta
      name="twitter:image"
      content="<%= htmlWebpackPlugin.options.publicSiteAddress %>/og-image.png"
    />

    <title><%= htmlWebpackPlugin.options.title %></title>
    <% if (htmlWebpackPlugin.options.isProduction) { %>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((reg) => console.log("SW registered: ", reg))
            .catch((err) => console.error("SW registration failed: ", err));
        });
      }
    </script>
    <% } else { %>
    <script>
      console.log("🛠️ Development Mode: Service Worker injection skipped.");
    </script>
    <% } %>
    <style>
      :root {
        --bg: #ffffff;
        --text-main: #111827;
        --text-muted: #4b5563;
        --border: #e5e7eb;
        --btn-bg: #1f2937;
        --btn-text: #ffffff;
        --btn-hover: #111827;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0f19;
          --text-main: #f9fafb;
          --text-muted: #9ca3af;
          --border: #1f2937;
          --btn-bg: #f3f4f6;
          --btn-text: #111827;
          --btn-hover: #ffffff;
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Helvetica, Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text-main);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }

      .error-card {
        max-width: 560px;
        width: 100%;
      }

      .header-group {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 24px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 24px;
      }

      .code {
        font-size: 2.25rem;
        font-weight: 700;
        letter-spacing: -0.05em;
        color: var(--text-main);
        line-height: 1;
      }

      .divider {
        width: 1px;
        height: 32px;
        background-color: var(--border);
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }

      p {
        font-size: 1rem;
        color: var(--text-muted);
        line-height: 1.6;
        margin-bottom: 32px;
      }

      .actions {
        display: flex;
        gap: 12px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 4px;
        transition:
          background-color 0.15s ease,
          border-color 0.15s ease;
      }

      .btn-primary {
        background-color: var(--btn-bg);
        color: var(--btn-text);
      }

      .btn-primary:hover {
        background-color: var(--btn-hover);
      }

      .btn-secondary {
        border: 1px solid var(--border);
        color: var(--text-main);
        background-color: transparent;
      }

      .btn-secondary:hover {
        background-color: var(--border);
      }

      @media (max-width: 480px) {
        .header-group {
          flex-direction: column;
          align-items: flex-start;
          gap: 12px;
        }
        .divider {
          display: none;
        }
        .actions {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="error-card">
      <div class="header-group">
        <span class="code" aria-hidden="true">404</span>
        <div class="divider" aria-hidden="true"></div>
        <h1>Page Not Found</h1>
      </div>

      <p>
        The requested page could not be located on this server. The URL may be
        incorrect, or the resource may have been permanently removed.
      </p>

      <div class="actions">
        <a href="/" class="btn btn-primary">Return to Homepage</a>
        <button onclick="window.history.back()" class="btn btn-secondary">
          Go Back
        </button>
      </div>
    </div>
  </body>
</html>
